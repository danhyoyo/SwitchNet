data:
  name: synthetic
  num_classes: 3
  input_dim: 16
  train_size: 3000
  val_size: 600
  test_size: 1200
  class_separation: 2.0
  noise_std: 1.0
  imbalance_ratio: 1.0
  batch_size: 128
  num_workers: 0
model:
  name: switchnet_v1
  feature_dim: 64
  encoder_width: 128
  expert_bottleneck: 16
  dropout: 0.1
  spec_margin: 1.0
  spec_weight: 0.2
  gate_parameter_match: true
  gate_max_hidden: 256
train:
  epochs: 30
  lr: 0.001
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine
  grad_clip: 5.0
  device: auto
  amp: true
  seed: 42
  deterministic: true
  checkpoint_every: 5
analysis:
  enabled: true
  gradient_batches: 2
  specialization: true
  flops: true
logging:
  output_dir: runs
  tensorboard: true
